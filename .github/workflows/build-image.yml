# Publishes the pinned Jaspr toolchain images. This workflow only builds and
# pushes a public package: no deploy host, no environment, no PR trigger.
name: build-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'scripts/**'
      - '.github/workflows/build-image.yml'

permissions:
  contents: read
  packages: write

env:
  JASPR_CLI_VERSION: 0.23.5
  TW_VERSION: 4.3.0

jobs:
  dart-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dart.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JASPR_CLI_VERSION=${{ env.JASPR_CLI_VERSION }}
            TW_VERSION=${{ env.TW_VERSION }}
          tags: ghcr.io/dip-develop/jaspr-build-image:dart-3.13.4-jaspr-0.23.5-tailwind-4.3.0

  flutter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/flutter.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JASPR_CLI_VERSION=${{ env.JASPR_CLI_VERSION }}
            TW_VERSION=${{ env.TW_VERSION }}
          tags: ghcr.io/dip-develop/jaspr-build-image:flutter-3.44.9-jaspr-0.23.5-tailwind-4.3.0
